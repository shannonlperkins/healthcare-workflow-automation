name: Radiology monitor tests

on:
  pull_request:
    paths:
      - 'radiology-sla-capacity-monitor/**'
      - '.github/workflows/radiology-monitor-tests.yml'
  push:
    branches: [main]
    paths:
      - 'radiology-sla-capacity-monitor/**'
      - '.github/workflows/radiology-monitor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: radiology-sla-capacity-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: radiology-sla-capacity-monitor/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
